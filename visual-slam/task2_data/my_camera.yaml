# Camera config for StellaVSLAM, derived from example/aist/equirectangular.yaml
# Generated by calibrate_camera.py: 39 views, RMS reprojection error 0.312 px
#
# Changes vs. equirectangular.yaml (everything else is kept as in the template):
#   Camera.model  equirectangular -> perspective (normal webcam, not a 360 camera)
#   Camera.fx/fy/cx/cy and k1/k2/p1/p2/k3 added from calibration (camera matrix
#                 and distortion coefficients; the 360 model has neither)
#   Camera.name/fps/cols/rows set to this camera and video
#   Preprocessing.mask_rectangles removed (they mask the 360 camera's tripod/body)
#   System.num_grid_cols/rows removed (sized for 1920x960 panoramas; defaults used)

Camera:
  name: "my_webcam"
  setup: "monocular"
  model: "perspective"

  fx: 1246.3557
  fy: 1246.9036
  cx: 962.0678
  cy: 536.2371

  k1: 0.188936
  k2: -0.521586
  p1: -0.000183
  p2: 0.001421
  k3: 0.397265

  fps: 20.0
  cols: 1920
  rows: 1080

  color_order: "RGB"

Preprocessing:
  min_size: 800

Feature:
  name: "default ORB feature extraction setting"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  backend: "g2o"
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.95
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20
  residual_deg_thr: 0.4

Tracking:
  backend: "g2o"

LoopDetector:
  backend: "g2o"
  enabled: true
  reject_by_graph_distance: true
  min_distance_on_graph: 50

GraphOptimizer:
  min_num_shared_lms: 200

GlobalOptimizer:
  thr_neighbor_keyframes: 100

System:
  map_format: "msgpack"

PangolinViewer:
  keyframe_size: 0.05
  keyframe_line_width: 1
  graph_line_width: 1
  point_size: 2
  camera_size: 0.08
  camera_line_width: 3
  viewpoint_x: 0
  viewpoint_y: -0.9
  viewpoint_z: -1.9
  viewpoint_f: 400
